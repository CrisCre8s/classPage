<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171719" />
    <title>Spiele · H-FI24-1B</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/computer-48x48.png" />
    <link rel="preload" href="/fonts/PublicSans.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/fonts/JetBrainsMono.woff" as="font" type="font/woff" crossorigin />
  </head>
  <body>
    <!-- Icon-Sprite (Outline, 1.5px) -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" /></symbol>
        <symbol id="i-school" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5z" /><path d="M6 12v5c3 3 9 3 12 0v-5" /></symbol>
        <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" /></symbol>
        <symbol id="i-card" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2" /><circle cx="8" cy="12" r="2" /><path d="M13 10h5M13 14h3" /></symbol>
        <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M8.5 14.5s1.3 1.8 3.5 1.8 3.5-1.8 3.5-1.8M9 9.5h.01M15 9.5h.01" /></symbol>
        <symbol id="i-void" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /><path d="M3 3l18 18" /></symbol>
        <symbol id="i-out" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9" /></symbol>
        <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6M8 13h8M8 17h6" /></symbol>
        <symbol id="i-game" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="4" /><path d="M7 10.5v4M5 12.5h4M15.5 11.5h.01M18 13.5h.01" /></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="9" cy="9" r="2" /><path d="m21 15-5-5L5 21" /></symbol>
      </defs>
    </svg>

    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <div class="page">
      <!-- Icon-Rail (Handy: Leiste unten) -->
      <nav class="rail" aria-label="Navigation">
        <!-- Der kleine Computer führt zurück zum Hub -->
        <a class="rail-mark off-hide" href="/" title="Zum Hub">
          <img src="/computer-48x48.png" alt="" width="34" height="34" /><span class="lbl">Hub</span>
        </a>
        <a class="off-hide" href="/spiele.html" aria-current="page" title="Spiele">
          <svg class="i"><use href="#i-game" /></svg><span class="lbl">Spiele</span>
        </a>
        <a class="off-hide" href="https://sbsz-hsp.com/davinci-timetable.html" target="_blank" rel="noopener" title="Stunden- & Vertretungsplan">
          <svg class="i"><use href="#i-calendar" /></svg><span class="lbl">Plan</span>
        </a>
        <a class="off-hide" href="https://sbsz-hsp.com/hip/default.php" target="_blank" rel="noopener" title="Klassenbuch & Noten">
          <svg class="i"><use href="#i-school" /></svg><span class="lbl">Noten</span>
        </a>
        <a class="off-hide" href="https://sbsz-hsp.com/" target="_blank" rel="noopener" title="Schulwebseite">
          <svg class="i"><use href="#i-globe" /></svg><span class="lbl">Schule</span>
        </a>
        <a class="off-hide" href="https://azubi.gfi.ihk.de/" target="_blank" rel="noopener" title="Azubi-Portal">
          <svg class="i"><use href="#i-card" /></svg><span class="lbl">Azubi</span>
        </a>

        <div class="rail-bottom">
          <a class="off-hide desk" href="https://theuselessweb.com/" target="_blank" rel="noopener" title="Take me to a useless website">
            <svg class="i"><use href="#i-smile" /></svg><span class="lbl">Useless</span>
          </a>
          <button class="off-hide desk void-btn" id="void-btn" type="button" title="Void-Funktion">
            <svg class="i"><use href="#i-void" /></svg><span class="lbl">Void</span>
          </button>
        </div>
      </nav>

      <!-- POWER oben rechts: schaltet die Seite aus, nur die Sterne bleiben -->
      <button class="power is-on" id="power-btn" type="button" aria-pressed="true" title="Seite aus- und einschalten">
        <span class="power-led" aria-hidden="true"></span>
        <span class="power-label">POWER</span>
      </button>

      <div class="canvas crt">
        <main class="col">
          <header class="title-row">
            <div>
              <h1 class="page-title">Spiele</h1>
              <p class="sub">12 Spiele · <strong>Leicht, Mittel oder Schwer</strong></p>
            </div>
            <a class="btn btn-ghost" href="/">Zurück zum Hub</a>
          </header>

          <!-- Spielfläche (sichtbar, sobald ein Spiel läuft) -->
          <section class="panel stage" id="stage" hidden aria-labelledby="stage-title">
            <div class="panel-head">
              <h1 id="stage-title"></h1>
              <span class="chip" id="stage-level"></span>
              <span class="stage-status num" id="stage-status" aria-live="polite"></span>
              <button class="more" type="button" id="stage-close">Beenden</button>
            </div>
            <div class="stage-body" id="stage-body">
              <canvas id="game-canvas" tabindex="0" aria-label="Spielfeld"></canvas>
              <div class="game-dom" id="game-dom" hidden></div>
              <div class="stage-msg" id="stage-msg" hidden></div>
            </div>
            <p class="stage-help" id="stage-help"></p>
          </section>

          <!-- Karten werden aus games/katalog.js erzeugt (spiele.js) -->
          <div class="games" id="games"></div>
        </main>
      </div>
    </div>

    <div id="void-ui">
      <p class="void-ui-title">PRESS ENTER TO START</p>
      <div class="void-ui-hints">
        <p>↑ FASTER</p>
        <p>↓ SLOWER</p>
        <p>ENTER – RESTART</p>
        <p>ESC – GO BACK</p>
      </div>
    </div>

    <script type="module" src="/spiele.js"></script>
  </body>
</html>
